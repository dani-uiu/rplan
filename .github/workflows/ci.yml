name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS has its own workflow (macos.yml, run by hand or on v* tags): Mac minutes cost 10x on a private repo.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Unit tests
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: UI tests (headless Chrome/Edge)
        shell: bash
        run: node tests/ui_test.mjs "target/release/rplan$([ "$RUNNER_OS" = Windows ] && echo .exe)"
      - name: Upload UI screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-failures-${{ matrix.os }}
          path: ui-shots/
          if-no-files-found: ignore
