[package]
name = "rplan"
version = "0.1.0"
edition = "2021"
description = "Fast, plain-text project scheduler: critical path, Gantt, resource load"

[dependencies]

# A native app window (WebView2 on Windows, WKWebView on macOS). Linux uses the browser.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }

# The macOS menu bar (Edit menu for copy/paste, Quit, Window).
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.17", default-features = false }

[profile.release]
opt-level = 3
lto = true

# Windows Smart App Control judges each new unsigned binary separately and
# sometimes blocks the unoptimized test binary; these settings get past it here.
[profile.test]
opt-level = 1
codegen-units = 4

[patch.crates-io]
webview2-com-sys = { path = "vendor/webview2-com-sys" }
