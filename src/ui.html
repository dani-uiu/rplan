<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>rplan</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 24x24 32x32 48x48 64x64 256x256">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#7c5cff">
<style>
:root{
  --bg:#0b0e14;--panel:#121722;--panel2:#171d2a;--panel3:#1d2433;--line:#222a3a;--line2:#1a2130;
  --fg:#e8ecf4;--mut:#8b95a9;--dim:#5c667a;
  --acc:#7c5cff;--acc2:#4f8cff;--ok1:#4f8cff;--ok2:#36c9d6;
  --cr1:#ff4d6d;--cr2:#ff8a4c;--ms:#ffc94d;--good:#32d583;--warn:#ffb020;
  --off:rgba(255,255,255,.028);--hol:rgba(255,201,77,.08);--sel:rgba(124,92,255,.13);--sum:#dfe4ee;
  --shadow:0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f4f6fb;--panel:#ffffff;--panel2:#f7f8fc;--panel3:#eef1f7;--line:#e2e6ee;--line2:#edf0f5;
  --fg:#141a26;--mut:#5f6b80;--dim:#9aa3b5;--sum:#2a3142;
  --off:rgba(20,30,60,.04);--hol:rgba(255,170,0,.12);--sel:rgba(124,92,255,.10);
  --shadow:0 10px 30px rgba(20,30,60,.15);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:13px/1.4 Inter,"Segoe UI Variable","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{min-width:0}
[hidden]{display:none!important}
svg.i{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* top bar */
.top{display:flex;align-items:center;gap:12px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.02em;font-size:15px}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;box-shadow:0 4px 14px rgba(124,92,255,.45)}
.pname{background:transparent;border:1px solid transparent;border-radius:8px;padding:5px 8px;font-size:15px;font-weight:600;width:260px}
.pname:hover{border-color:var(--line)}.pname:focus{outline:none;border-color:var(--acc);background:var(--panel2)}
.field{display:flex;align-items:center;gap:6px;color:var(--mut);font-size:12px}
.field input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.tabs{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:3px;margin-left:auto}
.tabs button{border:0;background:transparent;padding:6px 13px;border-radius:7px;cursor:pointer;color:var(--mut);display:flex;gap:6px;align-items:center;font-weight:500}
.tabs button.on{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;box-shadow:0 2px 10px rgba(124,92,255,.4)}
.tabs button:not(.on):hover{color:var(--fg)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);padding:5px 10px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap;height:30px}
.btn:hover:not(:disabled){border-color:var(--dim)}
.btn.primary{background:linear-gradient(135deg,var(--acc),var(--acc2));border-color:transparent;color:#fff}
.btn.icon{padding:5px 7px}
.btn.on{border-color:var(--cr1);color:var(--cr1)}
.btn.danger{color:var(--cr1)}
.btn.sm{height:26px;padding:3px 9px;font-size:12px}
.btn:disabled{opacity:.4;cursor:default}
.sep{width:1px;height:20px;background:var(--line);margin:0 2px}
.caret{opacity:.6;margin-left:-2px}

/* toolbar + KPIs */
.toolbar{display:flex;gap:6px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.toolbar .grow{flex:1}
.kpis{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg);overflow-x:auto}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:7px 13px;min-width:112px;flex:none}
.kpi b{display:block;font-size:16.5px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi b small{font-size:11.5px;color:var(--mut);font-weight:500}
.kpi span{color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em}
.kpi.warn b{color:var(--cr1)}.kpi.good b{color:var(--good)}.kpi.amber b{color:var(--warn)}
.pbar{height:4px;border-radius:4px;background:var(--line);margin-top:5px;overflow:hidden}
.pbar>div{height:100%;background:linear-gradient(90deg,var(--good),#7ee0b0);border-radius:4px;transition:width .4s}

/* layout */
.work{flex:1;min-height:0;display:flex;position:relative}
main{flex:1;min-width:0;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto}
.gt{display:grid;grid-template-columns:var(--gw) max-content;width:max-content;min-width:100%;align-content:start}
.corner,.thead{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);height:52px}
.corner{left:0;z-index:7;display:grid;align-items:end;border-right:1px solid var(--line)}
.gridl{position:sticky;left:0;z-index:4;background:var(--panel);border-right:1px solid var(--line)}
.cols{display:grid;grid-template-columns:var(--cols);align-items:center}
.corner .cols{height:28px;color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.corner .cols>div{padding:0 7px;white-space:nowrap;overflow:hidden}
.row{height:var(--rh);border-bottom:1px solid var(--line2);position:relative}
.row:hover{background:var(--panel2)}
.row.sel{background:var(--sel)}
.row.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--acc)}
.row.drop-before{box-shadow:inset 0 2px 0 var(--acc)}
.row.drop-after{box-shadow:inset 0 -2px 0 var(--acc)}
.row>div{padding:0 3px;min-width:0}
.row .num{color:var(--dim);font-variant-numeric:tabular-nums;padding-left:6px;font-size:12px;cursor:grab;display:flex;align-items:center;gap:3px;user-select:none;height:100%}
.row .num::before{content:"⋮⋮";letter-spacing:-3px;opacity:0;font-size:11px;margin-right:2px}
.row:hover .num::before{opacity:.6}
.row.crit .num{color:var(--cr1)}
.row .wbs{color:var(--dim);font-size:11.5px;font-variant-numeric:tabular-nums;padding-left:6px}
.row input{width:100%;background:transparent;border:1px solid transparent;border-radius:6px;padding:4px 6px;font-variant-numeric:tabular-nums}
.row input:hover:not(:disabled){border-color:var(--line)}
.row input:focus{outline:none;border-color:var(--acc);background:var(--bg)}
.row input:disabled{color:var(--mut)}
.row.sum input[data-f="name"]{font-weight:650}
.row .date{color:var(--mut);font-size:12px;padding-left:7px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden}
.row .date i{font-style:normal;color:var(--dim)}
.row .nm{display:flex;align-items:center;gap:4px}
.chev{border:0;background:transparent;cursor:pointer;color:var(--mut);width:18px;height:18px;border-radius:5px;display:grid;place-items:center;flex:none;padding:0;transition:transform .15s}
.chev:hover{background:var(--panel3);color:var(--fg)}
.chev.closed{transform:rotate(-90deg)}
.chev-sp{width:18px;flex:none}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--ok1),var(--ok2))}
.dot.c{background:linear-gradient(135deg,var(--cr1),var(--cr2))}
.dot.m{background:var(--ms);border-radius:2px;transform:rotate(45deg)}
.dot.s{background:var(--sum);border-radius:2px}
.badge{font-size:10.5px;flex:none;cursor:default}
.pct{position:relative}
.pct .mini{position:absolute;left:9px;right:9px;bottom:4px;height:2px;border-radius:2px;background:var(--line)}
.pct .mini>div{height:100%;background:var(--good);border-radius:2px}
.money,.slipc{font-variant-numeric:tabular-nums;font-size:12px;color:var(--mut);padding-left:7px;white-space:nowrap}
.slipc.bad{color:var(--cr1)}.slipc.goodc{color:var(--good)}
.del{opacity:0;border:0;background:transparent;cursor:pointer;color:var(--mut);padding:4px;border-radius:6px}
.row:hover .del{opacity:1}.del:hover{color:var(--cr1);background:var(--panel3)}
.row.add input{color:var(--mut)}
.row.add input::placeholder{color:var(--dim)}
.empty{padding:28px;color:var(--mut);text-align:center}
.welcome{position:absolute;left:24px;top:24px;width:min(520px,calc(100% - 48px));background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}
.welcome h3{margin:0 0 6px;font-size:16px}
.welcome p{margin:0 0 14px;color:var(--mut);line-height:1.5}
.welcome .acts{display:flex;gap:8px;flex-wrap:wrap}

/* timeline */
.months,.days{display:flex;height:24px;white-space:nowrap}
.days{height:28px}
.months>div{border-left:1px solid var(--line);padding:4px 8px;font-weight:600;font-size:12px;overflow:hidden;flex:none}
.days>div{flex:none;text-align:center;font-size:11px;color:var(--mut);border-left:1px solid var(--line2);line-height:28px;cursor:pointer;overflow:visible;font-variant-numeric:tabular-nums}
.days>div.we{color:var(--dim);background:var(--off)}
.days>div.hol{color:var(--ms);background:var(--hol)}
.days>div.xw{color:var(--good)}
.days>div.today{color:#fff;background:var(--acc);border-radius:6px 6px 0 0}
.days>div:hover{color:var(--fg)}
.tbody{position:relative}
.stripe{position:absolute;top:0;bottom:0;background:var(--off);pointer-events:none}
.stripe.hol{background:var(--hol)}
.todayl{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);opacity:.7;pointer-events:none}
.selband{position:absolute;left:0;right:0;height:var(--rh);background:var(--sel);pointer-events:none}
.bar{position:absolute;height:20px;border-radius:6px;background:linear-gradient(90deg,var(--ok1),var(--ok2));box-shadow:0 2px 8px rgba(79,140,255,.22);cursor:grab;transition:filter .15s,opacity .2s}
.bar.c{background:linear-gradient(90deg,var(--cr1),var(--cr2));box-shadow:0 2px 10px rgba(255,77,109,.28)}
.bar.late{outline:2px dashed var(--warn);outline-offset:2px}
.bar:hover{filter:brightness(1.12)}
.bar.dragging,.ms.dragging{opacity:.75;cursor:grabbing;z-index:3}
.bar .prog{position:absolute;left:0;top:0;bottom:0;border-radius:6px 0 0 6px;background:repeating-linear-gradient(-45deg,rgba(255,255,255,.3) 0 6px,rgba(255,255,255,.13) 6px 12px);pointer-events:none}
.bar .prog.full{border-radius:6px}
.lab{position:absolute;left:calc(100% + 10px);top:2px;white-space:nowrap;font-size:12px;color:var(--mut);pointer-events:none}
.lab b{color:var(--fg);font-weight:500}
.lab .w{color:var(--warn)}
.bar .in{position:absolute;left:8px;right:8px;top:2px;color:#fff;font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.hr{position:absolute;right:-3px;top:0;bottom:0;width:10px;cursor:ew-resize}
.hl{position:absolute;right:-22px;top:3px;width:14px;height:14px;border-radius:50%;border:2px solid var(--acc);background:var(--panel);opacity:0;cursor:crosshair;transition:opacity .15s}
.bar:hover .hl,.ms:hover .hl,.sbar:hover .hl{opacity:1}
.pin{position:absolute;left:-15px;top:2px;font-size:11px;pointer-events:none}
.ms{position:absolute;width:16px;height:16px;transform:rotate(45deg);background:var(--ms);border-radius:3px;box-shadow:0 0 12px rgba(255,201,77,.5);cursor:grab}
.ms.c{background:linear-gradient(135deg,var(--cr1),var(--ms))}
.ms .lab{left:24px;top:-4px;transform:rotate(-45deg);transform-origin:0 50%;color:var(--fg);font-weight:500}
.ms .hl{transform:rotate(-45deg);right:-24px;top:-4px}
.sbar{position:absolute;height:8px;background:var(--sum);border-radius:2px;cursor:pointer}
.sbar::before,.sbar::after{content:"";position:absolute;top:0;border:6px solid transparent;border-top:8px solid var(--sum)}
.sbar::before{left:0;border-left-color:var(--sum)}
.sbar::after{right:0;border-right-color:var(--sum)}
.sbar .sprog{position:absolute;left:0;top:2px;height:4px;background:var(--good);border-radius:2px;pointer-events:none}
.sbar .lab{top:-5px}
.sbar.c{background:linear-gradient(90deg,var(--cr1),var(--cr2))}
.sbar.c::before{border-top-color:var(--cr1);border-left-color:var(--cr1)}
.sbar.c::after{border-top-color:var(--cr2);border-right-color:var(--cr2)}
.base{position:absolute;height:3px;background:var(--dim);border-radius:2px;opacity:.8;pointer-events:none}
.float{position:absolute;height:0;border-top:2px dotted var(--dim);pointer-events:none}
.dl{position:absolute;width:0;height:0;border:6px solid transparent;border-top:8px solid var(--cr1);cursor:help}
.dl.ok{border-top-color:var(--good)}
.dim .bar:not(.c),.dim .ms:not(.c),.dim .sbar:not(.c){opacity:.22}
.dim .lnk:not(.c){opacity:.12}
svg.links{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.lnk{fill:none;stroke:var(--dim);stroke-width:1.5}
.lnk.c{stroke:var(--cr1);stroke-width:1.8}
.tmp{stroke:var(--acc);stroke-width:2;stroke-dasharray:5 4;fill:none}

/* inspector */
.insp{width:360px;flex:none;border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:0 0 30px}
.ih{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:2}
.ih small{color:var(--mut)}
.ih .x{margin-left:auto;border:0;background:transparent;color:var(--mut);cursor:pointer;font-size:18px;line-height:1;padding:2px 6px;border-radius:6px}
.ih .x:hover{background:var(--panel3);color:var(--fg)}
.insp .iname{width:calc(100% - 28px);margin:12px 14px 4px;font-size:16px;font-weight:650;background:transparent;border:1px solid transparent;border-radius:8px;padding:5px 7px}
.insp .iname:hover{border-color:var(--line)}.insp .iname:focus{outline:none;border-color:var(--acc);background:var(--bg)}
.chips{display:flex;gap:5px;flex-wrap:wrap;padding:0 14px 6px}
.chip{display:inline-flex;align-items:center;font-size:10.5px;font-weight:650;padding:2px 8px;border-radius:20px;background:rgba(79,140,255,.15);color:var(--ok1);white-space:nowrap}
.chip.r{background:rgba(255,77,109,.15);color:var(--cr1)}
.chip.y{background:rgba(255,176,32,.16);color:var(--warn)}
.chip.g{background:rgba(50,213,131,.15);color:var(--good)}
.chip.n{background:var(--panel3);color:var(--mut)}
.isec{padding:12px 14px;border-top:1px solid var(--line2)}
.isec h5{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);display:flex;align-items:center;gap:6px}
.isec h5 .btn{margin-left:auto}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px}
.fl{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--mut)}
.fl input,.fl select,.insp textarea,.deprow input,.deprow select,.whorow input,.insp .wide{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 7px;color:var(--fg);width:100%}
.fl input:focus,.fl select:focus,.insp textarea:focus,.deprow input:focus,.deprow select:focus,.whorow input:focus,.insp .wide:focus{outline:none;border-color:var(--acc)}
.fl input:disabled{opacity:.5}
.ro{display:flex;flex-direction:column;font-size:11.5px;color:var(--mut)}
.ro b{color:var(--fg);font-weight:500;font-size:12.5px;font-variant-numeric:tabular-nums}
.ro b.r{color:var(--cr1)}
.deprow,.whorow{display:grid;gap:5px;margin-bottom:6px;align-items:center}
.deprow{grid-template-columns:1fr 64px 62px 26px}
.whorow{grid-template-columns:1fr 70px 26px}
.rm{border:0;background:transparent;color:var(--mut);cursor:pointer;border-radius:6px;height:26px}
.rm:hover{color:var(--cr1);background:var(--panel3)}
.hint{color:var(--dim);font-size:11px;display:block;margin-top:4px;line-height:1.45}
.insp textarea{min-height:70px;resize:vertical}
.warnbox{background:rgba(255,176,32,.1);border:1px solid rgba(255,176,32,.35);color:var(--warn);border-radius:8px;padding:7px 9px;font-size:12px;margin-top:8px}

/* network */
.net{position:relative}
.node{position:absolute;width:210px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,border-color .15s}
.node:hover{transform:translateY(-2px);border-color:var(--dim)}
.node.c{border-color:var(--cr1);box-shadow:0 0 0 1px var(--cr1),0 8px 24px rgba(255,77,109,.22)}
.node.sel{outline:2px solid var(--acc);outline-offset:2px}
.node h4{margin:0 0 6px;font-size:13px;display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node h4 small{color:var(--dim);font-weight:500}
.node .grp{font-size:10.5px;color:var(--mut);margin:-3px 0 6px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.node .g{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:11px;color:var(--mut)}
.node .g b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.node .pb{height:3px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
.node .pb>div{height:100%;background:var(--good)}
.nedge{fill:none;stroke:var(--dim);stroke-width:1.6}
.nedge.c{stroke:var(--cr1);stroke-width:2}

/* people */
.res .row{height:var(--rh)}
.res .who{display:flex;align-items:center;gap:8px;padding:0 8px 0 10px;height:100%}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:11px;flex:none}
.res .meta{font-size:11.5px;color:var(--mut);line-height:1.3;padding-left:6px}
.res .meta b{color:var(--fg);font-weight:500}
.res .meta .bad{color:var(--cr1);font-weight:600}
.cell{position:absolute;height:28px;border-radius:5px;display:grid;place-items:center;font-size:10.5px;font-weight:700;color:#fff;background:linear-gradient(180deg,var(--ok1),var(--ok2));opacity:calc(.35 + .65 * var(--a))}
.cell.over{background:linear-gradient(180deg,var(--cr1),var(--cr2));opacity:1;box-shadow:0 0 12px rgba(255,77,109,.4)}
.poff{position:absolute;height:var(--rh);background:repeating-linear-gradient(-45deg,transparent 0 4px,var(--off) 4px 8px),var(--hol);pointer-events:none}
.banner{display:flex;align-items:center;gap:12px;margin:12px 14px;padding:11px 15px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}
.banner.bad{border-color:rgba(255,77,109,.5);background:linear-gradient(90deg,rgba(255,77,109,.12),transparent)}
.banner.ok{border-color:rgba(50,213,131,.4);background:linear-gradient(90deg,rgba(50,213,131,.1),transparent)}
.banner .acts{margin-left:auto;display:flex;gap:6px}

/* menus, dialog, status, toast, tooltip */
.menu{position:fixed;z-index:40;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:5px;min-width:220px}
.menu button{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;padding:7px 10px;border-radius:7px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--panel3)}
.menu button small{margin-left:auto;color:var(--dim)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:0;width:min(880px,calc(100vw - 32px));max-height:calc(100vh - 48px)}
dialog::backdrop{background:rgba(5,8,14,.55);backdrop-filter:blur(2px)}
.dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.dh h3{margin:0;font-size:16px}
.dh .x{margin-left:auto;border:0;background:transparent;color:var(--mut);cursor:pointer;font-size:20px;padding:2px 8px;border-radius:6px}
.db{padding:6px 18px 18px}
.db h4{margin:16px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:6px 18px}
.wkrow{display:grid;grid-template-columns:62px 1fr 36px;align-items:center;gap:8px}
.wkrow input[type=text],.exrow input,.exrow select,.db .inl input{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 8px;width:100%}
.wkrow input:disabled,.exrow input:disabled{opacity:.4}
.sw{display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:600}
.mut{color:var(--mut);font-size:12px}
.presets{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.inl{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-top:12px}
.inl label{display:flex;align-items:center;gap:8px;color:var(--mut)}
.inl input{width:90px!important}
.exrow{display:grid;grid-template-columns:140px 136px 14px 136px 1fr 170px 28px;gap:6px;align-items:center;margin-bottom:6px}
.months4{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.mon h6{margin:0 0 6px;font-size:12.5px}
.mon .g7{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mon .g7 span{font-size:10px;color:var(--dim);text-align:center}
.mon .g7 button{border:0;background:var(--panel2);border-radius:5px;height:24px;font-size:11px;cursor:pointer;font-variant-numeric:tabular-nums}
.mon .g7 button:hover{outline:1px solid var(--acc)}
.mon .g7 button.off{background:transparent;color:var(--dim)}
.mon .g7 button.hol{background:var(--hol);color:var(--ms);font-weight:700}
.mon .g7 button.xw{background:rgba(50,213,131,.15);color:var(--good);font-weight:700}
.mon .g7 button.st{outline:2px solid var(--acc)}
.newrow{display:flex;gap:8px}
.newrow input{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.newrow input:focus{outline:none;border-color:var(--acc)}
.files{display:flex;flex-direction:column;gap:4px;max-height:50vh;overflow:auto}
.fileit{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid transparent;background:transparent;padding:8px 10px;border-radius:9px;cursor:pointer}
.fileit:hover:not(:disabled){background:var(--panel2);border-color:var(--line)}
.fileit img{width:22px;height:22px}
.fileit span{display:flex;flex-direction:column;flex:1;min-width:0}
.fileit span small{color:var(--dim);font-size:11px}
.fileit>small{color:var(--mut);font-size:11.5px;white-space:nowrap}
.fileit.cur{background:var(--sel);cursor:default}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:13px}
.keys kbd,.status kbd{background:var(--panel2);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font:inherit;font-size:11px}
.status{display:flex;gap:16px;align-items:center;padding:5px 14px;border-top:1px solid var(--line);background:var(--panel);color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden}
.status .saved{color:var(--good);transition:opacity .4s}
.status .r{margin-left:auto;display:flex;gap:14px}
#toasts{position:fixed;bottom:42px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;z-index:60;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);padding:9px 16px;border-radius:10px;animation:tin .25s ease-out;max-width:640px}
.toast.err{border-color:var(--cr1);color:var(--cr1)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#tip{position:fixed;z-index:70;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:10px 12px;font-size:12px;display:none;min-width:210px;max-width:340px}
#tip h5{margin:0 0 6px;font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
#tip .g{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;color:var(--mut)}
#tip .g b{color:var(--fg);font-weight:500}

@media (max-width:1100px){.hide-m{display:none!important}.pname{width:170px}}
@media print{
  @page{size:landscape;margin:10mm}
  body{overflow:visible;height:auto;background:#fff;color:#000;--bg:#fff;--panel:#fff;--panel2:#fff;--fg:#000;--mut:#444;--line:#ccc;--line2:#e5e5e5;--sum:#222;--off:#f3f3f3}
  .top .tabs,.top #theme,.top #help,.toolbar,.status,.insp,#toasts,#tip,.row.add,.del,.hl,.hr{display:none!important}
  .work,main{display:block;overflow:visible}
  .view{position:static;overflow:visible}
  .corner,.thead,.gridl{position:static}
  .row input{border:0!important}
  .bar,.ms,.cell,.sbar{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header class="top">
  <div class="logo"><i><svg class="i" viewBox="0 0 24 24" style="stroke:#fff"><path d="M4 6h9M8 12h12M6 18h7"/></svg></i>rplan</div>

  <label class="field hide-m">Start <input type="date" id="pstart" aria-label="Project start date"></label>

    <button data-v="resources"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 010 7M19 14.8c1.4.9 2.3 2.7 2.6 5.2"/></svg>People</button>
  </nav>

  <button class="btn icon" id="theme" title="Toggle theme"><svg class="i" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg></button>
</header>
<section class="toolbar" id="toolbar"></section>
<section class="kpis" id="kpis"></section>
<div class="work">
  <main id="main"></main>
  <aside class="insp" id="insp"></aside>
</div>
<footer class="status">
  <span id="fpath"></span>
  <span class="saved" id="saved" style="opacity:0">● Saved</span>
  <span class="r hide-m">
    <span><kbd>N</kbd> new</span><span><kbd>Tab</kbd> indent</span><span><kbd>Del</kbd> delete</span><span><kbd>Ctrl</kbd>+<kbd>Z</kbd> undo</span>
    <span>drag bar = move · drag edge = duration · drag ○ = link</span><span><kbd>?</kbd> all shortcuts</span>
  </span>
</footer>
<dialog id="dlg"></dialog>
<input type="file" id="file" accept=".xml,application/xml,text/xml" hidden>
<datalist id="dl-people"></datalist>
<div id="toasts" role="status" aria-live="polite"></div>
<div id="tip"></div>

<script>
"use strict";
const TOKEN = "__RPLAN_TOKEN__";
const $ = (s, r = document) => r.querySelector(s);

const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const DOWL = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];

const ICON = {
  plus: '<path d="M12 5v14M5 12h14"/>', undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 010 10h-3"/>',
  redo: '<path d="M15 14l5-5-5-5"/><path d="M20 9H9a5 5 0 000 10h3"/>', zin: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4M8 11h6M11 8v6"/>',

  level: '<path d="M3 7h6M3 12h10M3 17h14M17 4l3 3-3 3"/>', fire: '<path d="M12 3s5 4.5 5 9.5a5 5 0 01-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-5 1-8z"/>',

  cal: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>', ind: '<path d="M4 6h16M10 12h10M10 18h10M4 10l3 2.5L4 15"/>',
  out: '<path d="M4 6h16M10 12h10M10 18h10M7 10l-3 2.5L7 15"/>', side: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>',
  base: '<path d="M3 17h18M6 13h8M6 9h12"/>', table: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/>',
  chev: '<path d="M6 9l6 6 6-6"/>',

const ic = n => `<svg class="i" viewBox="0 0 24 24">${ICON[n]}</svg>`;
function store(k, v) { try { if (v === undefined) return localStorage.getItem('rplan.' + k); localStorage.setItem('rplan.' + k, v); } catch (e) { return null; } }

/* ---------- state ---------- */
let D = null, undo = [], redo = [], drag = null, dragRow = null, suppressClick = false, dlgKind = null, chain = Promise.resolve();

let view = ['gantt', 'network', 'resources'].includes(location.hash.slice(1)) ? location.hash.slice(1) : store('view') || 'gantt';
let dw = +store('dw') || 0;
let tableMode = store('table') || 'full';
let inspOpen = store('insp') === '1';
let collapsed = new Set();
const RH = 36, PAD = 3, RRH = 52;
const inspW = () => inspOpen && sel.size ? 360 : 0;

/* ---------- calendar & formatting ---------- */
let START = 0, EXC = new Map();
const ymd = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const dateOf = d => new Date(START + d * 864e5);
const dateStr = d => dateOf(d).toISOString().slice(0, 10);
const hm = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
const dtStr = m => `${dateStr(Math.floor(m / 1440))}T${hm(((m % 1440) + 1440) % 1440)}`;
const wdOf = d => dateOf(d).getUTCDay();
const dayHours = d => EXC.has(d) ? EXC.get(d).hours : D.week[wdOf(d)];
const isOff = d => dayHours(d).length === 0;
const nice = d => { const x = dateOf(d); return `${DOW[x.getUTCDay()]} ${MON[x.getUTCMonth()]} ${x.getUTCDate()}`; };
const offOf = s => Math.round((ymd(s) - START) / 864e5);
const sDay = t => Math.floor(t.es / 1440);
const fDay = t => t.ef > t.es ? Math.floor((t.ef - 1) / 1440) : Math.floor(t.es / 1440);
const dmin = () => D.dayMinutes;
const hoursStr = h => h.length ? h.map(([a, b]) => `${hm(a)}-${hm(b)}`).join(' ') : 'off';
const hoursLen = h => h.reduce((a, [x, y]) => a + y - x, 0);
const cl = s => String(s ?? '').replace(/[|;\r\n]/g, ' ').trim();
const rn = s => cl(s).replace(/[,\[\]]/g, ' ').replace(/\s+/g, ' ').trim();
function workDays(a, b) { let n = 0; for (let d = a; d <= b; d++) if (!isOff(d)) n++; return n; }
function fmtDur(m) { if (!m) return '0'; const d = dmin(); if (m % d === 0) return `${m / d}d`; if (m % 60 === 0) return `${m / 60}h`; return `${m}m`; }
function fmtDays(m) { const v = m / dmin(); return (Math.abs(v - Math.round(v)) < 0.05 ? Math.round(v) : v.toFixed(1)) + 'd'; }
function money(x) { const v = Math.round(+x || 0); return (v < 0 ? '-' : '') + (D.currency || '$') + Math.abs(v).toLocaleString('en-US'); }
function when(m, isEnd) {
  const d = Math.floor((isEnd ? m - 1 : m) / 1440), h = dayHours(d), t = m - d * 1440;
  const edge = h.length && (t === h[0][0] || t === h[h.length - 1][1]);
  return `${nice(d)}${edge ? '' : ' ' + hm(t % 1440)}`;
}
const kindStr = d => `${d.id}${d.kind === 'FS' ? '' : d.kind}${d.lag ? (d.lag > 0 ? '+' : '-') + fmtDur(Math.abs(d.lag)) : ''}`;
const depsStr = t => t.deps.map(kindStr).join(', ');
const whoStr = t => t.who.map(a => a.units === 100 ? a.name : `${a.name}[${a.units}%]`).join(', ');
function nowRel() { const n = new Date(); return Math.round((Date.UTC(n.getFullYear(), n.getMonth(), n.getDate(), n.getHours(), n.getMinutes()) - START) / 60000); }
const todayOff = () => Math.floor(nowRel() / 1440);
function noClick() { suppressClick = true; setTimeout(() => { suppressClick = false; }, 0); }

/* ---------- parsing user input (mirrors the .plan format) ---------- */
function parseDur(s) {
  s = String(s).trim().toLowerCase().replace(/\?$/, '');
  const m = s.match(/^(\d+(?:\.\d+)?|\.\d+)\s*([a-z]*)$/);
  if (!m) throw new Error(`"${s}" isn't a duration — try 3d, 4h, 30m, 2w or 0 for a milestone`);
  const u = m[2] || 'd';
  const per = /^(d|days?|ed)$/.test(u) ? dmin() : /^(h|hrs?|hours?)$/.test(u) ? 60 : /^(m|mins?|minutes?)$/.test(u) ? 1 : /^(w|wks?|weeks?)$/.test(u) ? dmin() * 5 : null;
  if (per == null) throw new Error(`"${s}": unknown unit — use d, h, m or w`);
  return Math.round(+m[1] * per);
}
function parseLag(s) { s = String(s).trim(); if (!s || s === '0') return 0; const m = s.match(/^([+-])?\s*(.+)$/); const v = parseDur(m[2]); return m[1] === '-' ? -v : v; }
function parseDeps(s) {
  const out = [];
  for (const part of String(s).split(',').map(x => x.trim()).filter(Boolean)) {
    const m = part.match(/^#?(\d+)\s*(FS|SS|FF|SF)?\s*(?:([+-])\s*(.+))?$/i);
    if (!m) throw new Error(`"${part}" isn't a link — examples: 3, 3SS, 3FS+2d, 3FF-4h`);
    const lag = m[3] ? (m[3] === '-' ? -parseDur(m[4]) : parseDur(m[4])) : 0;
    out.push({ id: +m[1], kind: (m[2] || 'FS').toUpperCase(), lag });

  return out;
}
function parseWho(s) {
  const out = [];
  for (const part of String(s).split(',').map(x => x.trim()).filter(Boolean)) {
    const m = part.match(/^(.+?)\s*(?:\[\s*(\d+)\s*%?\s*\])?$/);
    const name = rn(m[1]), units = m[2] ? +m[2] : 100;
    if (!name) throw new Error(`"${part}": missing a name`);
    if (units < 1 || units > 1000) throw new Error(`"${part}": units must be 1–1000%`);
    if (!out.some(a => a.name === name)) out.push({ name, units });
  }
  return out;
}
function parseHours(s) {
  s = String(s).trim();
  if (!s || /^off$/i.test(s)) return [];
  const out = [];
  for (const p of s.split(/[\s,]+/).filter(Boolean)) {
    const m = p.match(/^(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})$/);
    if (!m) throw new Error(`"${p}" isn't a time range — use 08:00-12:00`);
    const a = +m[1] * 60 + +m[2], b = +m[3] * 60 + +m[4];
    if (b <= a || b > 1440 || +m[2] > 59 || +m[4] > 59) throw new Error(`"${p}" isn't a valid range`);
    out.push([a, b]);
  }
  out.sort((x, y) => x[0] - y[0]);
  for (let i = 1; i < out.length; i++) if (out[i][0] < out[i - 1][1]) throw new Error('Those working hours overlap');

}
function parseRanges(s) {
  return String(s).split(',').map(x => x.trim()).filter(Boolean).map(p => {

    if (!m) throw new Error(`"${p}" — use dates like 2026-12-24 or 2026-12-24..2026-12-31`);
    const a = offOf(m[1]), b = offOf(m[2] || m[1]);

const rangeStr = (a, b) => a === b ? dateStr(a) : `${dateStr(a)}..${dateStr(b)}`;

}
function relatives(i) {
  const par = parentsOf(D.tasks), out = new Set([D.tasks[i].id]);

  for (let j = i + 1; j < subtreeEnd(D.tasks, i); j++) out.add(D.tasks[j].id);
  return out;
}
const tIdx = id => D.tasks.findIndex(t => t.id === id);
const task = id => D.tasks.find(t => t.id === id);

/* ---------- server ---------- */
async function api(method, url, body) {
  let r;
  try { r = await fetch(url, { method, body, headers: { 'X-Rplan-Token': TOKEN, ...(D && method !== 'GET' ? { 'X-Rplan-Rev': D.rev } : {}) } }); }

function accept(j) {

  for (const e of D.exceptions) for (let d = e.from; d <= e.to && d <= e.from + 4000; d++) EXC.set(d, e);

  sel = new Set([...sel].filter(id => ids.has(id)));
  if (!ids.has(primary)) primary = sel.size ? [...sel][sel.size - 1] : null;
  try { collapsed = new Set(JSON.parse(store('collapsed:' + D.path) || '[]')); } catch (e) { collapsed = new Set(); }

}
let firstLoad = true;
async function load() {
  const j = await api('GET', '/api/project');
  if (!j.ok) return toast(j.error, 1);
  accept(j);

function model() {
  return {
    name: D.name, start: D.start, currency: D.currency, dayMinutes: D.dayMinutes,
    week: D.week.map(h => h.map(x => [...x])),
    exceptions: D.exceptions.map(e => ({ ...e, hours: e.hours.map(x => [...x]) })),
    resources: D.resources.filter(r => r.declared).map(r => ({ ...r, off: r.off.map(x => [...x]) })),
    tasks: D.tasks.map(t => ({ id: t.id, name: t.name, level: t.level, dur: t.dur, deps: t.deps.map(d => ({ ...d })), who: t.who.map(a => ({ ...a })), pct: t.pct, constraint: t.constraint ? { ...t.constraint } : null, deadline: t.deadline, fixed: t.fixed, delay: t.delay, base: t.base ? [...t.base] : null, note: t.note })),
  };

const mt = (m, id) => m.tasks.find(t => t.id === id);
function ensureRes(m, name) {
  let r = m.resources.find(r => r.name === name);
  if (!r) { const src = D.resources.find(r => r.name === name); r = src ? { ...src, off: src.off.map(x => [...x]) } : { name, rate: 0, capacity: 100, off: [] }; r.declared = true; m.resources.push(r); }
  return r;
}
function toText(m) {
  const L = [], lines = [];
  const add = (s, id = null) => { L.push(s); lines.push(id); };
  add(`project ${cl(m.name) || 'Untitled'}`);
  add(`start ${m.start}`);
  if (m.currency && m.currency !== '$') add(`currency ${cl(m.currency)}`);
  m.week.forEach((h, i) => add(`week ${DOW[i]} ${hoursStr(h)}`));
  add(`dayhours ${+(m.dayMinutes / 60).toFixed(4)}`);
  for (const e of m.exceptions) add(e.hours.length ? `workday ${rangeStr(e.from, e.to)} ${hoursStr(e.hours)} ${cl(e.name)}`.trim() : `holiday ${rangeStr(e.from, e.to)} ${cl(e.name)}`.trim());
  for (const r of m.resources) add(`resource ${rn(r.name)} | rate ${+r.rate || 0} | capacity ${r.capacity || 100}${r.off.length ? ' | off ' + r.off.map(([a, b]) => rangeStr(a, b)).join(', ') : ''}`);
  for (const t of m.tasks) {
    const at = [];
    if (t.constraint) at.push(`${t.constraint.type}=${dtStr(t.constraint.at)}`);
    if (t.deadline != null) at.push(`deadline=${dateStr(t.deadline)}`);
    if (+t.fixed) at.push(`cost=${+t.fixed}`);

}
function action(url, confirmMsg) {

    if (!j.ok) { if (!j.handled) toast(j.error, 1); return; }

const doRedo = () => restore(redo, undo, 'Redone');

function focusSel(el) {

  if (!keys.length) return null;

}
function render() {
  if (!D) return;
  const a = document.activeElement, fsel = focusSel(a);
  const fval = a && 'value' in a ? a.value : null, fs = a && a.selectionStart, fe = a && a.selectionEnd;
  const v = $('#main .view'), scroll = v ? [v.dataset.v, v.scrollLeft, v.scrollTop] : null, iscroll = $('#insp').scrollTop;
  document.title = `${D.name} · rplan`;

  const nv = $('#main .view');

  inspector(); $('#insp').scrollTop = iscroll;

  if (fsel) {

}

function renderKpis() {
  const leaves = D.tasks.filter(t => !t.summary), now = nowRel();
  const over = D.loads.filter(l => l.over > 0), crit = leaves.filter(t => t.crit).length;
  const late = D.tasks.filter(t => t.late).length, conflict = leaves.filter(t => t.conflict).length;
  const behind = leaves.filter(t => behindOf(t, now)).length;
  const based = D.tasks.filter(t => t.base);
  let slip = '';
  if (based.length) {
    const bf = Math.max(...based.map(t => t.base[1])), a = Math.floor((bf - 1) / 1440), b = Math.floor((D.finish - 1) / 1440);
    const s = a <= b ? workDays(a + 1, b) : -workDays(b + 1, a);
    slip = `<div class="kpi ${s > 0 ? 'warn' : 'good'}" title="Finish compared with the saved baseline"><span>vs baseline</span><b>${s > 0 ? '+' + s + 'd late' : s < 0 ? -s + 'd early' : 'on time'}</b></div>`;
  }
  $('#kpis').innerHTML = `
    <div class="kpi"><span>Finish</span><b>${D.tasks.length ? nice(Math.floor((D.finish - 1) / 1440)) : '—'}</b></div>
    <div class="kpi"><span>Duration</span><b>${fmtDays(D.span)} <small>work</small></b></div>
    <div class="kpi" style="min-width:150px"><span>Progress</span><b>${(+D.progress).toFixed(0)}%</b><div class="pbar"><div style="width:${D.progress}%"></div></div></div>
    <div class="kpi"><span>Cost</span><b>${money(D.cost)}</b></div>
    <div class="kpi"><span>Tasks</span><b>${leaves.length}</b></div>
    <div class="kpi ${crit ? 'warn' : ''}"><span>Critical</span><b>${crit}</b></div>
    <div class="kpi ${over.length ? 'warn' : 'good'}" title="${esc(over.map(l => l.name).join(', '))}"><span>Over-allocated</span><b>${over.length ? over.length + (over.length > 1 ? ' people' : ' person') : 'None ✓'}</b></div>
    ${late ? `<div class="kpi warn" title="Tasks finishing after their deadline"><span>Past deadline</span><b>${late}</b></div>` : ''}
    ${behind ? `<div class="kpi amber" title="Less done than expected for today"><span>Behind</span><b>${behind}</b></div>` : ''}
    ${conflict ? `<div class="kpi amber" title="A 'must start on' date clashes with predecessors"><span>Conflicts</span><b>${conflict}</b></div>` : ''}

}
function behindOf(t, now) { if (t.summary || t.dur === 0 || t.pct >= 100 || now <= t.es) return false; const exp = Math.min(1, (now - t.es) / Math.max(1, t.ef - t.es)) * 100; return t.pct + 10 < exp; }

function colsDef() {
  const full = tableMode === 'full';
  const c = [['num', '#', 50]];

  if (full && D.tasks.some(t => t.cost > 0)) c.push(['cost', 'Cost', 74]);

}
const X = m => (m / 1440 + PAD) * dw;

  if (!D.tasks.length) bars += `<div class="welcome"><h3>Start planning “${esc(D.name)}”</h3>

    <div class="acts"><button class="btn primary" data-act="add">${ic('plus')}Add the first task</button><button class="btn" data-act="import">${ic('up')}Import from ProjectLibre</button><button class="btn" data-act="calendar">${ic('cal')}Set working hours</button><button class="btn" data-act="sample">Try the sample project</button></div></div>`;

      </defs>${links}</svg>
      ${bars}

function consLabel(c) { if (!c) return 'As soon as possible'; const d = when(c.at); return { snet: `Start no earlier than ${d}`, fnet: `Finish no earlier than ${d}`, mso: `Must start on ${d}` }[c.type]; }

function network() {
  const par = parentsOf(D.tasks), byId = new Map(D.tasks.map((t, i) => [t.id, i]));
  const leavesOf = i => { const out = []; for (let j = i; j < subtreeEnd(D.tasks, i); j++) if (!D.tasks[j].summary) out.push(j); return out; };
  const edges = [];
  D.tasks.forEach((t, i) => {
    if (t.summary) return;
    const deps = []; for (let a = i; a >= 0; a = par[a]) deps.push(...D.tasks[a].deps);
    for (const d of deps) {
      const pi = byId.get(d.id); if (pi == null) continue;
      let srcs = D.tasks[pi].summary ? leavesOf(pi) : [pi];
      if (D.tasks[pi].summary && srcs.length) { const st = d.kind === 'SS' || d.kind === 'SF'; const key = j => st ? D.tasks[j].es : D.tasks[j].ef; const best = st ? Math.min(...srcs.map(key)) : Math.max(...srcs.map(key)); srcs = [srcs.find(j => key(j) === best)]; }
      for (const s of srcs) edges.push({ from: s, to: i, d });
    }
  });
  const leaves = D.tasks.map((t, i) => i).filter(i => !D.tasks[i].summary), lvl = new Map();
  const into = new Map(leaves.map(i => [i, []])); edges.forEach(e => into.get(e.to)?.push(e.from));
  const L = i => { if (lvl.has(i)) return lvl.get(i); lvl.set(i, 0); const v = into.get(i).length ? 1 + Math.max(...into.get(i).map(L)) : 0; lvl.set(i, v); return v; };
  leaves.forEach(L);
  const cols = new Map(), pos = new Map(); let W = 0, H = 0;
  for (const i of leaves) { const l = lvl.get(i); if (!cols.has(l)) cols.set(l, []); cols.get(l).push(i); }
  for (const [l, is] of cols) is.forEach((i, r) => { const x = 40 + l * 270, y = 40 + r * 168; pos.set(i, { x, y }); W = Math.max(W, x + 260); H = Math.max(H, y + 168); });
  let nodes = '', es = '';
  for (const i of leaves) {
    const t = D.tasks[i], { x, y } = pos.get(i), grp = par[i] >= 0 ? D.tasks[par[i]].name : '';
    nodes += `<div class="node ${t.crit ? 'c' : ''} ${sel.has(t.id) ? 'sel' : ''}" style="left:${x}px;top:${y}px" data-node="${t.id}">
      <h4><span class="dot ${t.dur === 0 ? 'm' : t.crit ? 'c' : ''}"></span><small>#${t.id}</small>${esc(t.name)}</h4>${grp ? `<div class="grp">${esc(grp)}</div>` : ''}
      <div class="g"><span>Start</span><span>Finish</span><b>${nice(sDay(t))}</b><b>${nice(fDay(t))}</b>
      <span>Duration</span><span>Slack</span><b>${t.dur ? fmtDur(t.dur) : 'milestone'}</b><b style="color:${t.slack > 0 ? 'var(--fg)' : 'var(--cr1)'}">${fmtDays(t.slack)}</b></div>
      <div class="g" style="margin-top:4px"><span>${esc(whoStr(t) || 'Unassigned')}</span><span style="text-align:right">${t.pct}%</span></div>
      <div class="pb"><div style="width:${t.pct}%"></div></div></div>`;
  }
  for (const e of edges) {
    const a = pos.get(e.from), b = pos.get(e.to); if (!a || !b) continue;
    const s = D.tasks[e.from], t = D.tasks[e.to], c = s.crit && t.crit ? 'c' : '';
    const x1 = a.x + 210, y1 = a.y + 55, x2 = b.x - 4, y2 = b.y + 55, mx = (x1 + x2) / 2;
    es += `<path class="nedge ${c}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" marker-end="url(#n${c})"/>`;
    const lab = (e.d.kind !== 'FS' ? e.d.kind : '') + (e.d.lag ? (e.d.lag > 0 ? '+' : '-') + fmtDur(Math.abs(e.d.lag)) : '');
    if (lab) es += `<text x="${mx}" y="${(y1 + y2) / 2 - 6}" fill="var(--mut)" font-size="11" text-anchor="middle">${lab}</text>`;
  }
  return `<div class="view" data-v="network"><div class="net" style="width:${W + 40}px;height:${H + 40}px">
    <svg width="${W + 40}" height="${H + 40}" style="position:absolute;left:0;top:0"><defs>
      <marker id="n" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="var(--dim)"/></marker>
      <marker id="nc" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L8,4 L0,8z" fill="var(--cr1)"/></marker>
    </defs>${es}</svg>${nodes || '<div class="empty">No tasks yet.</div>'}</div></div>`;
}

      case 'wk-on': m.week[d] = el.checked ? (m.week.find(h => h.length) || STD).map(x => [...x]) : []; if (m.week.every(h => !h.length)) throw new Error('At least one weekday needs working hours'); break;
      case 'wk-h': m.week[d] = parseHours(v); if (m.week.every(h => !h.length)) throw new Error('At least one weekday needs working hours'); break;
      case 'dh': { const h = +v.replace(',', '.'); if (!(h >= 0.25 && h <= 24)) throw new Error('Hours per day must be between 0.25 and 24'); m.dayMinutes = Math.round(h * 60); break; }
      case 'cur': m.currency = cl(v) || '$'; break;
      case 'ex-type': m.exceptions[k].hours = v === 'off' ? [] : (m.week.find(h => h.length) || STD).map(x => [...x]); break;
      case 'ex-from': { const a = offOf(v); m.exceptions[k].from = a; if (m.exceptions[k].to < a) m.exceptions[k].to = a; break; }
      case 'ex-to': { const b = offOf(v); if (b < m.exceptions[k].from) throw new Error("The end date can't be before the start"); m.exceptions[k].to = b; break; }
      case 'ex-name': m.exceptions[k].name = cl(v); break;
      case 'ex-hours': { const h = parseHours(v); if (!h.length) throw new Error('A working day needs hours (or switch it to "Day off")'); m.exceptions[k].hours = h; break; }
    }
  });
}
function resChange(el, v) {
  const f = el.dataset.res, name = el.dataset.name;
  commit(m => {
    if (f === 'new') { const n = rn(v); if (!n) return false; if (D.resources.some(r => r.name === n)) throw new Error(`${n} is already on the team`); ensureRes(m, n); return; }
    const r = ensureRes(m, name);
    if (f === 'name') { const n = rn(v); if (!n || n === name) return false; if (D.resources.some(x => x.name === n)) throw new Error(`${n} already exists`); r.name = n; m.tasks.forEach(t => t.who.forEach(a => { if (a.name === name) a.name = n; })); }
    if (f === 'rate') { const n = v === '' ? 0 : +v.replace(/[^\d.]/g, ''); if (!isFinite(n)) throw new Error('Rate must be a number'); r.rate = n; }
    if (f === 'capacity') { const n = parseInt(v, 10); if (!(n >= 1 && n <= 1000)) throw new Error('Capacity must be 1–1000%'); r.capacity = n; }
    if (f === 'off') r.off = parseRanges(v);
  }, f === 'new' ? `Added ${rn(v)}` : null);
}
async function importFile(input) {
  const f = input.files[0]; input.value = ''; if (!f) return;
  const xml = await f.text();
  if (D.tasks.length && !confirm(`Replace “${D.name}” with “${f.name}”?\nYou can undo this with Ctrl+Z.`)) return;
  return enqueue(async () => {
    const prev = D.text, j = await api('POST', '/api/import', xml);
    if (!j.ok) { if (!j.handled) toast('Import failed: ' + j.error, 1); return; }
    undo.push(prev); redo = []; sel = new Set(); primary = null;
    accept(j); fit(); saved(); toast(`Imported ${j.tasks.length} tasks and ${j.resources.length} people from ${f.name}`);
  });
}

document.addEventListener('keydown', e => {
  const el = e.target, inInput = el.matches && el.matches('input,select,textarea');
  if (e.key === 'Escape' && $('#menu')) { closeMenu(); return; }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'o') { e.preventDefault(); act('open'); return; }
  if ($('#dlg').open) { if (e.key === 'Enter' && el.id === 'new-file-name') act('create-file'); return; }
  if (inInput) {
    if (e.key === 'Enter' && el.dataset.f === 'new') { const name = el.value.trim(); if (name) addTask(name); return; }
    if (e.key === 'Enter' && el.tagName !== 'TEXTAREA' && el.tagName !== 'SELECT') { el.blur(); return; }
    if (e.key === 'Escape') { render(); el.blur(); return; }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !el.value) { e.preventDefault(); doUndo(); }
    return;
  }
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? doRedo() : doUndo(); return; }
  if (mod && k === 'y') { e.preventDefault(); doRedo(); return; }
  if (mod && k === 'a' && view === 'gantt') { e.preventDefault(); sel = new Set(visibleRows().map(i => D.tasks[i].id)); render(); return; }
  if (mod) return;
  if (k === 'tab' && sel.size) { e.preventDefault(); indentSel(e.shiftKey ? -1 : 1); return; }
  if (e.altKey && (k === 'arrowright' || k === 'arrowleft') && sel.size) { e.preventDefault(); indentSel(k === 'arrowright' ? 1 : -1); return; }
  if (k === '1') setView('gantt'); if (k === '2') setView('network'); if (k === '3') setView('resources');
  if (k === 'n') { e.preventDefault(); act('add'); }
  if (k === '+' || k === '=') zoom(1.25);
  if (k === '-') zoom(0.8);
  if (k === 'f') fit();
  if (k === 'c') { focusCrit = !focusCrit; render(); }
  if (k === '?') openDialog('help');
  if (k === 'enter' && primary != null) { inspOpen = true; store('insp', '1'); render(); setTimeout(() => $('[data-insp="name"]')?.focus(), 0); }
  if ((k === 'delete' || k === 'backspace') && sel.size) { const n = sel.size; commit(m => { removeTasks(m, new Set(sel)); }, `Deleted ${n} task(s) — Ctrl+Z to undo`); }
  if (k === 'escape') { sel = new Set(); primary = null; render(); }
  if ((k === 'arrowup' || k === 'arrowdown') && D.tasks.length) {
    e.preventDefault();
    const dir = k === 'arrowup' ? -1 : 1;
    if (e.altKey && primary != null) { restructure(m => moveUpDown(m, primary, dir)); return; }
    const vis = visibleRows().map(i => D.tasks[i].id), i = vis.indexOf(primary);
    const j = i < 0 ? 0 : Math.max(0, Math.min(vis.length - 1, i + dir));
    if (e.shiftKey && primary != null) { sel.add(vis[j]); primary = vis[j]; } else { sel = new Set([vis[j]]); primary = anchor = vis[j]; }
    render(); document.querySelector(`[data-row="${primary}"]`)?.scrollIntoView({ block: 'nearest' });
  }
});
document.addEventListener('copy', e => {
  if (e.target.matches?.('input,textarea') && e.target.selectionStart !== e.target.selectionEnd) return;
  if (!sel.size || !D) return;
  const rows = D.tasks.filter(t => sel.has(t.id)), min = Math.min(...rows.map(t => t.level));
  e.clipboardData.setData('text/plain', rows.map(t => ['  '.repeat(t.level - min) + t.name, t.summary ? '' : fmtDur(t.dur), depsStr(t), whoStr(t), t.pct].join('\t')).join('\n'));
  e.preventDefault(); toast(`Copied ${rows.length} task(s) — paste here or into a spreadsheet`);
});
document.addEventListener('paste', e => {
  const txt = e.clipboardData.getData('text/plain'), inNew = e.target.dataset?.f === 'new';
  if (e.target.matches?.('input,textarea') && !(inNew && /[\t\n]/.test(txt.trim()))) return;
  if (view !== 'gantt' || !txt.trim()) return;
  e.preventDefault(); pasteRows(txt);
});

/* drag rows to reorder */
const clearDrop = () => $$('.drop-before,.drop-after').forEach(r => r.classList.remove('drop-before', 'drop-after'));
document.addEventListener('dragstart', e => { const h = e.target.closest?.('[data-drag]'); if (!h) return; dragRow = +h.dataset.drag; e.dataTransfer.setData('text/plain', ''); e.dataTransfer.effectAllowed = 'move'; });
document.addEventListener('dragover', e => {
  if (dragRow == null) return; const row = e.target.closest('[data-row]'); clearDrop();
  if (!row) return; e.preventDefault(); const r = row.getBoundingClientRect(); row.classList.add(e.clientY > r.top + r.height / 2 ? 'drop-after' : 'drop-before');
});
document.addEventListener('drop', e => {
  if (dragRow == null) return; const row = e.target.closest('[data-row]'); e.preventDefault();
  const id = dragRow, after = row?.classList.contains('drop-after'); dragRow = null; clearDrop();
  if (!row || +row.dataset.row === id) return;
  const target = +row.dataset.row;
  restructure(m => moveBlock(m, id, target, after), `Moved #${id}`);
});
document.addEventListener('dragend', () => { dragRow = null; clearDrop(); });

/* drag bars: move (start-no-earlier-than), resize (duration), link */
document.addEventListener('mousedown', e => {
  if (e.button !== 0) return;
  const r = e.target.closest('[data-resize]'), l = e.target.closest('[data-link]'), mv = !r && !l && e.target.closest('[data-move]');
  if (!r && !l && !mv) return;
  hideTip();
  if (r) { e.preventDefault(); const bar = r.parentElement; drag = { kind: 'resize', id: +r.dataset.resize, bar, x0: e.clientX, w0: bar.offsetWidth }; document.body.style.cursor = 'ew-resize'; }
  else if (l) {
    e.preventDefault();
    const svg = $('#links'), box = svg.getBoundingClientRect(), src = l.parentElement.getBoundingClientRect();
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path'); p.setAttribute('class', 'tmp'); svg.appendChild(p);
    drag = { kind: 'link', id: +l.dataset.link, path: p, box, sx: src.right - box.left, sy: src.top + src.height / 2 - box.top }; document.body.style.cursor = 'crosshair';
  } else { drag = { kind: 'move', id: +mv.dataset.move, bar: mv, x0: e.clientX, l0: mv.offsetLeft, moved: false }; }
});
document.addEventListener('mousemove', e => {
  if (!drag) return moveTip(e);
  const t = task(drag.id);
  if (drag.kind === 'resize') {
    const w = Math.max(dw * 0.5, drag.w0 + e.clientX - drag.x0); drag.bar.style.width = w + 'px';
    const endDay = Math.floor((drag.bar.offsetLeft + w - 1) / dw - PAD);
    drag.dur = Math.max(1, workDays(sDay(t), endDay)) * dmin();
    showTip(e, `<h5>${esc(t.name)}</h5><b>${fmtDur(drag.dur)}</b> → ends ${nice(Math.max(endDay, sDay(t)))}`);
  } else if (drag.kind === 'link') {
    const x = e.clientX - drag.box.left, y = e.clientY - drag.box.top;
    drag.path.setAttribute('d', `M${drag.sx},${drag.sy} C${drag.sx + 60},${drag.sy} ${x - 60},${y} ${x},${y}`);
  } else {
    const dx = e.clientX - drag.x0; if (!drag.moved && Math.abs(dx) < 4) return;
    drag.moved = true; drag.bar.classList.add('dragging'); drag.bar.style.left = drag.l0 + dx + 'px';
    drag.day = t.dur === 0 ? Math.floor((drag.l0 + dx + 8) / dw - PAD) : Math.round((drag.l0 + dx) / dw - PAD);
    showTip(e, `<h5>${esc(t.name)}</h5>Start no earlier than <b>${nice(drag.day)}</b>`);
  }
});
document.addEventListener('mouseup', e => {
  if (!drag) return;
  const d = drag; drag = null; document.body.style.cursor = ''; hideTip();
  const t = task(d.id);
  if (d.kind === 'resize') {
    noClick();
    if (d.dur && d.dur !== t.dur) commit(m => { mt(m, d.id).dur = d.dur; }, `“${t.name}” is now ${fmtDur(d.dur)}`); else render();
  } else if (d.kind === 'link') {
    d.path.remove(); noClick();
    const tgt = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-bar],[data-row],[data-node]');
    const tid = tgt ? +(tgt.dataset.bar || tgt.dataset.row || tgt.dataset.node) : null;
    if (tid && tid !== d.id) commit(m => {
      const x = mt(m, tid); if (x.deps.some(y => y.id === d.id)) { toast('Already linked'); return false; }
      if (relatives(tIdx(tid)).has(d.id)) throw new Error("A task can't link to its own summary or subtask");
      x.deps.push({ id: d.id, kind: 'FS', lag: 0 });
    }, `Linked #${d.id} → #${tid}`);
  } else if (d.moved) {
    noClick();
    const day = d.day;
    commit(m => { mt(m, d.id).constraint = { type: 'snet', at: day * 1440 }; }, j => {
      const nt = j.tasks.find(x => x.id === d.id);
      return nt && Math.floor(nt.es / 1440) > day ? `#${d.id} can't start before ${nice(Math.floor(nt.es / 1440))} (its predecessors or a day off) — constraint saved anyway` : `#${d.id} now starts no earlier than ${nice(day)} (📌 remove it in Details)`;
    });
  }
});

/* tooltip */
const tip = $('#tip');
function showTip(e, html) { tip.innerHTML = html; tip.style.display = 'block'; const r = tip.getBoundingClientRect(); tip.style.left = Math.min(e.clientX + 16, innerWidth - r.width - 10) + 'px'; tip.style.top = Math.min(e.clientY + 16, innerHeight - r.height - 10) + 'px'; }
function hideTip() { tip.style.display = 'none'; }
function moveTip(e) {
  const b = e.target.closest && e.target.closest('[data-tip]');
  if (!b || e.target.closest('[data-link],[data-resize]')) return hideTip();
  const t = task(+b.dataset.tip); if (!t) return hideTip();
  showTip(e, `<h5>#${t.id} ${esc(t.name)} ${t.crit ? '<span class="chip r">critical</span>' : `<span class="chip">${fmtDays(t.slack)} slack</span>`}${t.late ? '<span class="chip r">late</span>' : ''}</h5>
    <div class="g"><span>Start</span><b>${esc(when(t.es))}</b><span>Finish</span><b>${esc(t.ef > t.es ? when(t.ef, true) : when(t.es))}</b>
    <span>Duration</span><b>${t.summary ? fmtDays(t.span) + ' (summary)' : t.dur ? fmtDur(t.dur) : 'Milestone'}</b><span>Who</span><b>${esc(whoStr(t) || '—')}</b>
    <span>Done</span><b>${Math.round(t.summary ? t.pctR : t.pct)}%</b><span>After</span><b>${esc(depsStr(t) || '—')}</b>
    <span>Latest start</span><b>${esc(when(t.ls))}</b>${t.cost ? `<span>Cost</span><b>${money(t.cost)}</b>` : ''}
    ${t.constraint ? `<span>Constraint</span><b>${esc(consLabel(t.constraint))}</b>` : ''}${t.deadline != null ? `<span>Deadline</span><b>${nice(t.deadline)}</b>` : ''}
    ${t.base ? `<span>Baseline</span><b>${esc(when(t.base[0]))} → ${esc(when(t.base[1], true))}</b>` : ''}</div>`);
}
document.addEventListener('mouseleave', hideTip);

/* misc */
function toast(msg, err) { const box = $('#toasts'); while (box.children.length >= 3) box.firstChild.remove(); const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg; $('#toasts').appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 2800); }
let savedT; function saved() { const s = $('#saved'); s.style.opacity = 1; clearTimeout(savedT); savedT = setTimeout(() => s.style.opacity = 0, 1600); }
function applyTheme(t) { document.documentElement.dataset.theme = t; }
applyTheme(store('theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
$('#theme').onclick = () => { const t = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; applyTheme(t); store('theme', t); };
$('#dlg').addEventListener('close', () => { dlgKind = null; });
document.addEventListener('wheel', e => { if (e.ctrlKey && view !== 'network') { e.preventDefault(); zoom(e.deltaY < 0 ? 1.1 : 0.9); } }, { passive: false });
let rt; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(render, 150); });
addEventListener('beforeprint', () => { if (view !== 'gantt') { view = 'gantt'; render(); } });

/* tell rplan the window is still open (it quits a while after the last window closes) */
setInterval(() => { fetch('/api/ping', { headers: { 'X-Rplan-Token': TOKEN } }).catch(() => {}); }, 15000);

/* live reload when the .plan file changes elsewhere (text editor, CLI, git pull…) */
setInterval(async () => {
  // Don't reload under someone's typing: only pause while a field has unsaved changes.
  const a = document.activeElement, typing = a?.matches('input,textarea') && a.value !== a.defaultValue;
  if (!D || drag || typing || $('#dlg').open) return;
  try {
    const r = await (await fetch('/api/rev', { headers: { 'X-Rplan-Token': TOKEN } })).json();
    if (r.rev && r.rev !== D.rev) { await chain; const old = D.text; await load(); if (D.text !== old) { undo.push(old); toast('Reloaded — the file changed on disk'); } }
  } catch (e) {}
}, 1500);

load();
</script>
