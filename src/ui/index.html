<html lang="en">

<body>
<header class="top">
  <div class="logo"><i><svg class="i" viewBox="0 0 24 24" style="stroke:#fff"><path d="M4 6h9M8 12h12M6 18h7"/></svg></i>rplan</div>
  <input class="pname" id="pname" spellcheck="false">

  <nav class="tabs" id="tabs"></nav>
  <button class="btn icon" id="lang" data-act="lang" title="Español / English">ES</button>

</header>
<section class="toolbar" id="toolbar"></section>
<section class="kpis" id="kpis"></section>

  <main id="main"></main>
  <aside class="insp" id="insp" hidden></aside>
</div>
<footer class="status">
  <span id="fpath"></span>
  <span class="saved" id="saved" style="opacity:0"></span>
  <span class="r hide-m" id="hints"></span>
</footer>
<dialog id="dlg"></dialog>
<div id="report" hidden></div>
<input type="file" id="file" accept=".xml,application/xml,text/xml" hidden>

<div id="toasts" role="status" aria-live="polite"></div>
<div id="tip"></div>
